    <rect x="250" y="474" width="30" height="106" fill="url(#gopuramGold)" opacity="0.7"/>
    <rect x="290" y="474" width="30" height="106" fill="url(#gopuramGold)" opacity="0.7"/>
    <rect x="480" y="474" width="30" height="106" fill="url(#gopuramGold)" opacity="0.7"/>
    <rect x="520" y="474" width="30" height="106" fill="url(#gopuramGold)" opacity="0.7"/>
