    <rect x="392" y="158" width="16" height="36" rx="5" fill="url(#innerGlow)"/>
    <rect x="416" y="160" width="16" height="34" rx="5" fill="url(#innerGlow)"/>
    <rect x="442" y="162" width="16" height="32" rx="5" fill="url(#innerGlow)"/>
