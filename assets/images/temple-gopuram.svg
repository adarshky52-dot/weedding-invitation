<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="gopuramGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#996515" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3D120B" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E2BC67" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#804A00" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="templeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

