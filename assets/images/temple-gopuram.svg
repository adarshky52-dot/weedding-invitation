    <rect x="310" y="386" width="22" height="54" rx="6" fill="url(#innerGlow)"/>
    <rect x="346" y="384" width="22" height="56" rx="6" fill="url(#innerGlow)"/>
    <rect x="432" y="384" width="22" height="56" rx="6" fill="url(#innerGlow)"/>
    <rect x="468" y="386" width="22" height="54" rx="6" fill="url(#innerGlow)"/>
